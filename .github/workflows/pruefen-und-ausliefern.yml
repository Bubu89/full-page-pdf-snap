# Prueft die Publikation und liefert den Worker aus — ohne dass ein fremder
# Dienst Zugriff auf dieses GitHub-Konto bekommt.
#
# Warum nicht "Workers Builds" aus dem Cloudflare-Dashboard: dieser Weg
# installiert die Cloudflare-GitHub-App und damit einen dauerhaften
# Fremdzugriff auf ein Konto, unter dem **73 private Repositorien** liegen. Der
# Gewinn waere derselbe automatische Deploy; der Preis ein Zugriff, der weit
# ueber dieses eine oeffentliche Repo hinausreicht und nach der Einrichtung
# niemandem mehr auffaellt.
#
# Hier laeuft es umgekehrt: Der Ablauf liegt sichtbar und versioniert im Repo,
# und nach aussen geht nur ein Token, das ausschliesslich Worker-Skripte
# schreiben darf. Cloudflare erfaehrt nichts ueber GitHub.
#
# Einrichtung, einmalig:
#   gh secret set CLOUDFLARE_API_TOKEN   # Token mit "Workers Scripts: Edit"
#   gh secret set CLOUDFLARE_ACCOUNT_ID
#
# Absichtlich KEIN pull_request-Ausloeser: in einem oeffentlichen Repo koennte
# ein fremder Beitrag sonst an die Geheimnisse gelangen. Nur direkte Pushes auf
# main, also nur, wer ohnehin Schreibrechte hat.

name: Pruefen und ausliefern

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    name: Rechtscheck und Verweise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Das eigentliche Tor. Der Rechtscheck prueft Belegpflicht, Offenlegung,
      # Haftungshinweis, Korrekturweg, Umgehungsanleitungen, Zusagen ohne
      # Grenze und Absichtsunterstellungen gegenueber Dritten. Was hier
      # durchfaellt, soll gar nicht erst oeffentlich werden — eine einmal
      # ausgelieferte Seite steht auch nach dem Loeschen im Archiv.
      - name: Rechtscheck
        run: python3 rechtscheck.py

      # Rohdaten unter docs/data/ gegen docs/data/schema.json (Issue #9).
      # BLOCKIEREND, absichtlich kein `|| true`: das Schema ist aus dem
      # Bestand abgeleitet und bildet die drei vorgefundenen Formate ab, der
      # Bestand ist konform — was hier durchfaellt, ist also ein echter
      # Befund (fehlendes Pflichtfeld, leere per_source bei genannten
      # Einzelwerten, kopierte Beschreibung) und soll nicht ausgeliefert
      # werden. Warnungen (z.B. fehlender Kontrolllauf) blockieren nicht.
      # Laeuft auf dem Runner mit dem eingebauten Stdlib-Pruefer, jsonschema
      # ist dort nicht installiert.
      - name: Rohdaten gegen Schema
        run: python3 tools/daten-pruefen.py --ci

      # Die Funktionstests liefen bisher nur von Hand — und waren rot, ohne
      # dass es jemandem auffiel: eine Aenderung am Endpunkt hatte einen Fall
      # ueberholt, und der Testlauf gehoerte in keine Pipeline.
      - name: Zitations-Tests
        # Dateien statt Verzeichnis: der Node auf dem Runner loest `tests/`
        # als Modul auf und bricht mit "Cannot find module" ab, bevor ein
        # einziger Test laeuft.
        run: node --test tests/*.mjs

      # Die Versionsauskunft muss die Wahrheit sagen, sonst ist sie schaedlicher
      # als keine. Sie darf abweichen — sie darf nur nicht veraltet sein.
      - name: Versionsauskunft aktuell
        run: |
          python3 build-versionen.py --check || {
            echo "::warning::extension-versions.json veraltet — build-versionen.py laufen lassen"
          }

      # Fristen. Warnt, blockiert nicht — eine bald ablaufende Frist ist kein
      # Grund, eine Auslieferung anzuhalten, sondern einer, es zu wissen.
      # In der Pipeline ohne Vaultwarden, also ohne die Token-Fristen; die
      # Domain und security.txt werden trotzdem geprueft.
      - name: Fristen
        run: python3 tools/fristen-pruefen.py --ci || true

      # Interne Ziele und Store-Staende. Externe Adressen werden hier bewusst
      # nicht geprueft: ein fremder Server, der gerade 503 antwortet, ist kein
      # Grund, die eigene Auslieferung anzuhalten.
      - name: Verweise und Store-Staende
        run: python3 tools/links-pruefen.py || true

      - name: Sitemap und Feed sind auf dem Stand der Dateien
        run: |
          python3 build-sitemap.py --check || {
            echo "::error::Sitemap veraltet — build-sitemap.py ausfuehren und committen"
            exit 1
          }
          # llms.txt ist der Index, llms-full.txt der Volltext und agent.md das
          # Blatt fuer den Erstkontakt. Wer llms-full.txt von Hand aendert und
          # den Index nicht neu baut, liefert zwei Staende gleichzeitig aus —
          # und die Datei, die ein Agent zuerst liest, ist dann die falsche.
          python3 build-llms-index.py --check || {
            echo "::error::llms.txt/llms-full.txt/agent.md veraltet — build-llms-index.py ausfuehren"
            exit 1
          }
          # Die Agenten-Karte nennt Fassung und Werkzeuge des Endpunkts. Sie war
          # handgepflegt und stand am 4. August auf 1.15.0 mit vier von neun
          # Werkzeugen — ohne install_extension, also ohne die Faehigkeit, um
          # derentwillen ein Agent den Endpunkt ueberhaupt aufsucht.
          python3 build-server-card.py --check || {
            echo "::error::server-card.json veraltet — build-server-card.py ausfuehren"
            exit 1
          }
          # Skill-Index, api-catalog und auth.md. Dieses Skript lief bisher in
          # keinem Schritt der Pipeline — deshalb konnte auth.md monatelang eine
          # Sperre beschreiben, die es nicht mehr gibt, und der Skill-Index den
          # Pruefsummen der Skills hinterherhinken.
          python3 build-agent-discovery.py --check || {
            echo "::error::Discovery-Dateien veraltet — build-agent-discovery.py ausfuehren"
            exit 1
          }
          # Gleiche Schluesselzahl heisst nicht gleiche Schluessel. Am 4. August
          # fehlten zwoelf Texte in jeder Sprache, am 6. zwei in sieben — beide
          # Male, weil beim Einbau nur Englisch und Deutsch geschrieben wurden
          # und es niemandem auffiel.
          python3 tools/sprachen-pruefen.py || {
            echo "::error::Oberflaechentexte unvollstaendig — tools/sprachen-pruefen.py zeigt, welche"
            exit 1
          }

      # Zweimal an einem Tag standen Platzhalter in ausgelieferten Seiten
      # ({TITEL}, {AMO}), weil ein Textblock in einen f-String geriet. Im
      # Quelltext faellt das nicht auf, auf der Seite schon.
      # Was ein SEO-Plugin im Redaktionsfenster anzeigen wuerde, hier als
      # Pruefung: fehlende Canonicals und Titel halten die Auslieferung an,
      # verwaiste Seiten und Laengen werden als Warnung gemeldet.
      - name: Auffindbarkeit und Kopfzeilen
        run: python3 tools/seo-pruefen.py --ci

      - name: Keine unaufgeloesten Platzhalter
        run: |
          treffer=$(grep -rlE '\{[A-Z_]{3,}\}' docs --include='*.html' || true)
          if [ -n "$treffer" ]; then
            echo "::error::Unaufgeloeste Platzhalter in: $treffer"
            exit 1
          fi

      # Der Grund, warum dieses Repo oeffentlich ist, darf nicht zum Leck
      # werden. Der Aggregator schrieb schon einmal 23 absolute Pfade in den
      # CHANGELOG.
      - name: Keine lokalen Pfade im Auslieferungsstand
        run: |
          # Nur die echten Kennungen, nicht jeder Beispielpfad: /home/name/
          # und /home/you/ stehen absichtlich in der Oberflaeche.
          # Diese Datei selbst ausnehmen — sie muss das Muster enthalten, um
          # danach suchen zu koennen, und fand sich beim ersten Lauf prompt selbst.
          # Auch die Windows-Schreibweise. Sie fehlte, und genau darueber ging
          # am 3. August 2026 ein verdrahtetes C:\Users\<name>\ in zwei
          # Skripten durch — die WSL-Fassung derselben Konstante war laengst
          # zur Laufzeit aufgeloest, die Windows-Fassung stand unveraendert
          # daneben. Ein Pruefer, der nur eine Schreibweise kennt, bestaetigt
          # den halben Umbau als ganzen.
          treffer=$(git ls-files | grep -v '^\.github/workflows/' \
                    | xargs grep -lE '/home/holo/|/mnt/c/Users/HOLO/|C:\\Users\\HOLO' 2>/dev/null || true)
          if [ -n "$treffer" ]; then
            echo "::error::Lokale Pfade in: $treffer"
            exit 1
          fi

  ausliefern:
    name: Worker ausliefern
    needs: pruefen
    runs-on: ubuntu-latest
    # Nur wenn der Worker sich geaendert hat. Eine Textkorrektur an einer Seite
    # braucht keine neue Worker-Fassung.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          # Der ganze Push wird betrachtet, nicht nur sein letzter Commit -
          # deshalb die volle Historie statt fetch-depth: 2.
          fetch-depth: 0

      - name: Hat sich am Worker etwas geaendert?
        id: geaendert
        run: |
          # Verglichen wird der GESAMTE Push, nicht HEAD~1..HEAD.
          #
          # Mit HEAD~1 sah der Schritt nur den letzten Commit. Wird der Worker
          # in einem frueheren Commit desselben Pushes geaendert - und drei
          # Commits auf einmal sind hier der Normalfall -, faellt die Aenderung
          # durch und der Server laeuft weiter mit der alten Fassung. Ohne
          # Fehlermeldung, denn der Lauf ist ja gruen.
          #
          # github.event.before ist der Stand VOR dem Push. Bei einem neuen
          # Zweig steht dort eine Null-Kennung; dann wird ausgeliefert, statt
          # zu raten.
          VORHER="${{ github.event.before }}"
          if [ -z "$VORHER" ] || [ "$VORHER" = "0000000000000000000000000000000000000000" ]; then
            echo "Kein Vorzustand bekannt (neuer Zweig oder manueller Start) — wird ausgeliefert."
            echo "ja=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$VORHER^{commit}" 2>/dev/null; then
            echo "Vorzustand $VORHER nicht auffindbar — wird ausgeliefert."
            echo "ja=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$VORHER" "${{ github.sha }}" | grep -q '^worker/'; then
            echo "Worker im Push geaendert:"
            git diff --name-only "$VORHER" "${{ github.sha }}" | grep '^worker/' | sed 's/^/  /'
            echo "ja=true" >> "$GITHUB_OUTPUT"
          else
            echo "ja=false" >> "$GITHUB_OUTPUT"
            echo "Worker unveraendert — nichts auszuliefern."
          fi

      - name: Syntaxpruefung
        if: steps.geaendert.outputs.ja == 'true'
        run: node --check worker/mcp.js

      - name: Ausliefern
        if: steps.geaendert.outputs.ja == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Die Route auf provinglab.dev/* steht seit Monaten und aendert sich
          # nicht. wrangler schreibt sie trotzdem bei jedem Lauf neu und bricht
          # ab, wenn das Token keine Zonenrechte hat — was hier Absicht ist: das
          # CI-Token darf ausschliesslich Worker-Skripte schreiben.
          #
          # Der erste Lauf zeigte, was daraus folgt: das Skript ging live
          # (Version 1.12.0 antwortete), und die Pipeline meldete trotzdem
          # Fehlschlag. Ein gruener Deploy als rot zu melden ist schlimmer als
          # keine Pipeline, weil man aufhoert hinzusehen.
          #
          # Deshalb liefert die CI ohne Routen-Block aus. Serverseitig bleibt die
          # Route bestehen — wrangler loescht bestehende Routen nicht, es legt
          # nur keine an.
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("wrangler.toml")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r"\n\[\[routes\]\][^\[]*", "\n", s)
          p.write_text(s, encoding="utf-8")
          print("Routen-Block fuer diesen Lauf entfernt")
          PY
          npx --yes wrangler@latest deploy

      - name: Gegenprobe am Live-Endpunkt
        if: steps.geaendert.outputs.ja == 'true'
        run: |
          sleep 25
          for versuch in 1 2 3 4 5 6; do
            fassung=$(curl -s -X POST https://provinglab.dev/mcp \
              -H 'content-type: application/json' -A 'github-actions-check/1.0' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["serverInfo"]["version"])' 2>/dev/null || echo "?")
            erwartet=$(grep -oP 'const VERSION = "\K[^"]+' worker/mcp.js)
            echo "Versuch $versuch: live=$fassung erwartet=$erwartet"
            [ "$fassung" = "$erwartet" ] && exit 0
            sleep 20
          done
          echo "::error::Der Endpunkt meldet nach dem Ausrollen nicht die erwartete Fassung"
          exit 1

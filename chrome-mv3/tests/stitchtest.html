<!doctype html>
<meta charset="utf-8">
<title>Stitch-Test</title>
<pre id="out"></pre>
<script>
/* Bildet das Zusammenfuegen mit Zuschnitt exakt so nach wie background.js
   und prueft das Ergebnis pixelweise:
     - ist der App-Rahmen (Seitenleiste, Kopfzeile) verschwunden?
     - sitzen die Segmente lueckenlos aneinander?
     - stimmen die Masse? */
const R = [];
const ok = (c, m) => R.push(`${c ? "OK  " : "FEHL"}  ${m}`);

const WIN_W = 1384, WIN_H = 805;      // Fenster
const CLIP = { x: 240, y: 64, w: 1144, h: 741 };   // wie im Layout-Test B gemessen
const SCALE = 2;                       // Screenshot in 2x (DPR)
const SIDEBAR = "#404040", HEADER = "#606060";

/* Ein Screenshot: Seitenleiste + Kopfzeile + Inhaltsbereich mit farbigen
   Streifen, deren Farbe die absolute Position codiert. */
function fakeShot(scrollTop) {
  const c = new OffscreenCanvas(WIN_W * SCALE, WIN_H * SCALE);
  const x = c.getContext("2d");
  x.fillStyle = "#ffffff"; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = SIDEBAR;   x.fillRect(0, 0, CLIP.x * SCALE, c.height);
  x.fillStyle = HEADER;    x.fillRect(0, 0, c.width, CLIP.y * SCALE);

  // Inhalt: 60-px-Streifen, Farbe = Position im Dokument
  const stripe = 60;
  for (let docY = Math.floor(scrollTop / stripe) * stripe;
       docY < scrollTop + CLIP.h + stripe; docY += stripe) {
    const yInClip = docY - scrollTop;
    const idx = docY / stripe;
    x.fillStyle = `rgb(${(idx * 37) % 256}, ${(idx * 91) % 256}, ${(idx * 53) % 256})`;
    x.fillRect(CLIP.x * SCALE, (CLIP.y + yInClip) * SCALE,
               CLIP.w * SCALE, stripe * SCALE);
  }
  return c.transferToImageBitmap();
}

(async () => {
  // --- Segmente wie im Capture-Loop ----------------------------------------
  const step = CLIP.h - 40;                     // wie stepCss in background.js
  const totalDoc = 2400;
  const segments = [];
  for (let y = 0; y <= totalDoc - CLIP.h; y += step) {
    const img = fakeShot(y);
    segments.push({ y, img, pxW: img.width, pxH: img.height });
  }
  R.push(`${segments.length} Segmente, Dokumenthoehe ${totalDoc} px, Schritt ${step} px`);

  // --- Exakt die Rechnung aus background.js --------------------------------
  const layout = { winH: WIN_H, viewportH: CLIP.h, clip: CLIP };
  const dprY = segments[0].pxH / (layout.winH || layout.viewportH);
  const clip = layout.clip;
  const srcX = Math.round(clip.x * dprY);
  const srcY = Math.round(clip.y * dprY);
  const pxW  = Math.round(clip.w * dprY);
  const segH = Math.round(clip.h * dprY);
  const lastSeg = segments[segments.length - 1];
  const bigH = Math.max(Math.round(lastSeg.y * dprY) + segH, segH);

  ok(dprY === SCALE, `Skalierung ueber Fensterhoehe korrekt (${dprY}, erwartet ${SCALE})`);
  ok(pxW === CLIP.w * SCALE, `Breite = nur Inhaltsbereich (${pxW}, erwartet ${CLIP.w * SCALE})`);
  ok(pxW < WIN_W * SCALE, `schmaler als das Fenster (${pxW} < ${WIN_W * SCALE}) - Seitenleiste weg`);

  const big = new OffscreenCanvas(pxW, bigH);
  const ctx = big.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, pxW, bigH);
  for (const seg of segments) {
    const destY = Math.round(seg.y * dprY);
    ctx.drawImage(seg.img, srcX, srcY, pxW, segH, 0, destY, pxW, segH);
  }

  // --- Pruefung 1: kein Rahmen mehr im Ergebnis ----------------------------
  const hex = (d) => `rgb(${d[0]}, ${d[1]}, ${d[2]})`;
  let sidebarHits = 0, headerHits = 0;
  for (let y = 5; y < bigH; y += 97) {
    for (let x = 2; x < pxW; x += 211) {
      const d = ctx.getImageData(x, y, 1, 1).data;
      if (Math.abs(d[0] - 64) < 6 && Math.abs(d[1] - 64) < 6 && Math.abs(d[2] - 64) < 6) sidebarHits++;
      if (Math.abs(d[0] - 96) < 6 && Math.abs(d[1] - 96) < 6 && Math.abs(d[2] - 96) < 6) headerHits++;
    }
  }
  ok(sidebarHits === 0, `keine Seitenleisten-Pixel im Ergebnis (${sidebarHits} Treffer)`);
  ok(headerHits === 0, `keine Kopfzeilen-Pixel im Ergebnis (${headerHits} Treffer)`);

  // --- Pruefung 2: Inhalt lueckenlos und in richtiger Reihenfolge ----------
  // Jeder 60-px-Streifen im Dokument muss an seiner Sollposition stehen.
  let wrong = 0, checked = 0;
  for (let idx = 0; idx * 60 + 30 < totalDoc - CLIP.h; idx++) {
    const docY = idx * 60 + 30;                 // Mitte des Streifens
    const py = Math.round(docY * SCALE);
    if (py >= bigH) break;
    const d = ctx.getImageData(Math.round(pxW / 2), py, 1, 1).data;
    const want = [(idx * 37) % 256, (idx * 91) % 256, (idx * 53) % 256];
    const near = want.every((v, i) => Math.abs(v - d[i]) <= 4);
    checked++;
    if (!near) { wrong++; if (wrong <= 3) R.push(`      Abweichung bei docY=${docY}: ${hex(d)} statt rgb(${want})`); }
  }
  ok(wrong === 0, `alle ${checked} Streifen an der richtigen Position (${wrong} Abweichungen)`);

  // --- Pruefung 3: keine weissen Luecken zwischen Segmenten ----------------
  let white = 0;
  for (let y = 0; y < bigH; y += 3) {
    const d = ctx.getImageData(Math.round(pxW / 2), y, 1, 1).data;
    if (d[0] > 250 && d[1] > 250 && d[2] > 250) white++;
  }
  ok(white === 0, `keine weissen Luecken im Verlauf (${white} von ${Math.ceil(bigH / 3)} Abtastungen)`);

  // ======================================================================
  //  Zweiter Durchlauf: Kontext-Modus - Menue einmal oben, darunter nur
  //  Inhalt auf Hintergrundfarbe.
  // ======================================================================
  R.push("");
  R.push("--- Kontext-Modus (Menue einmal oben) ---");

  // Farbe wird NICHT vorgegeben, sondern aus dem Screenshot abgetastet -
  // genau wie in background.js. Erwartet wird der Seitenleisten-Ton.
  const sample = (ctx, x0, x1, frameH, top) => {
    const counts = new Map();
    for (let i = 1; i <= 4; i++) {
      const y = Math.round(frameH - (frameH - top) * (i / 5));
      for (let j = 1; j <= 4; j++) {
        const x = Math.round(x0 + (x1 - x0) * (j / 5));
        const d = ctx.getImageData(x, y, 1, 1).data;
        const key = `${d[0]},${d[1]},${d[2]}`;
        counts.set(key, (counts.get(key) || 0) + 1);
      }
    }
    let win = null, n = 0;
    for (const [k, c] of counts) if (c > n) { win = k; n = c; }
    return win;
  };
  const kW = segments[0].pxW;                       // volle Fensterbreite
  const contentTop = srcY;
  const kH = Math.max(contentTop + Math.round(lastSeg.y * dprY) + segH, segments[0].pxH);

  const kBig = new OffscreenCanvas(kW, kH);
  const k = kBig.getContext("2d");
  k.fillStyle = "#ffffff"; k.fillRect(0, 0, kW, kH);
  const frameH = segments[0].pxH;
  k.drawImage(segments[0].img, 0, 0);
  const sideColor = sample(k, 0, srcX, frameH, srcY);
  k.fillStyle = `rgb(${sideColor})`;
  k.fillRect(0, frameH, srcX, kH - frameH);
  k.fillStyle = "#ffffff";
  k.fillRect(srcX, frameH, pxW, kH - frameH);
  for (let i = 1; i < segments.length; i++) {
    k.drawImage(segments[i].img, srcX, srcY, pxW, segH,
                srcX, contentTop + Math.round(segments[i].y * dprY), pxW, segH);
  }
  ok(sideColor === "64,64,64",
     `Fuellfarbe aus dem Screenshot abgetastet: rgb(${sideColor}) - Seitenleisten-Ton, nicht Weiss`);

  ok(kW === WIN_W * SCALE, `volle Fensterbreite erhalten (${kW})`);

  // Menue MUSS im obersten Bereich vorhanden sein
  const topSide = k.getImageData(20, contentTop + 40, 1, 1).data;
  const topHead = k.getImageData(Math.round(kW / 2), 20, 1, 1).data;
  ok(Math.abs(topSide[0] - 64) < 6, `Seitenleiste im ersten Abschnitt vorhanden (rgb(${topSide[0]},${topSide[1]},${topSide[2]}))`);
  ok(Math.abs(topHead[0] - 96) < 6, `Kopfzeile im ersten Abschnitt vorhanden (rgb(${topHead[0]},${topHead[1]},${topHead[2]}))`);

  // UNTERHALB des ersten Segments darf KEIN Menue mehr auftauchen
  const belowStart = contentTop + segH + 20;
  let repeats = 0, bgHits = 0, bgChecks = 0;
  for (let y = belowStart; y < kH - 5; y += 53) {
    const d = k.getImageData(20, y, 1, 1).data;            // linke Spalte
    if (Math.abs(d[0] - 96) < 6 && Math.abs(d[1] - 96) < 6) repeats++;
    bgChecks++;
    if (Math.abs(d[0] - 64) < 6 && Math.abs(d[1] - 64) < 6 && Math.abs(d[2] - 64) < 6) bgHits++;
  }
  ok(repeats === 0, `keine Kopfzeilen-Wiederholung weiter unten (${repeats} von ${bgChecks} Abtastungen)`);
  ok(bgHits === bgChecks, `frei gewordene Flaeche traegt durchgehend den Seitenleisten-Ton (${bgHits}/${bgChecks})`);

  // Inhalt muss auch hier lueckenlos durchlaufen
  let kWrong = 0, kChecked = 0;
  for (let idx = 0; idx * 60 + 30 < totalDoc - CLIP.h; idx++) {
    const py = contentTop + Math.round((idx * 60 + 30) * SCALE);
    if (py >= kH) break;
    const d = k.getImageData(srcX + Math.round(pxW / 2), py, 1, 1).data;
    const want = [(idx * 37) % 256, (idx * 91) % 256, (idx * 53) % 256];
    kChecked++;
    if (!want.every((v, i) => Math.abs(v - d[i]) <= 4)) kWrong++;
  }
  ok(kWrong === 0, `Inhalt lueckenlos an richtiger Position (${kChecked} Streifen, ${kWrong} Abweichungen)`);
  R.push(`      Kontext-Bild: ${kW} x ${kH} px`);

  R.push("");
  R.push(`Ergebnisbild: ${pxW} x ${bigH} px  (Fenster waere ${WIN_W * SCALE} x ...)`);
  R.push("");
  R.push("ERGEBNIS: " + (R.some(l => l.startsWith("FEHL")) ? "FEHLER" : "ALLE BESTANDEN"));
  document.getElementById("out").textContent = R.join("\n");
  document.title = "fertig";
})();
</script>

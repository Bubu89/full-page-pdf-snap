<!DOCTYPE html>
<html data-i18n-title="extName">
<head>
<meta charset="utf-8">
<title>Full Page PDF Snap</title>
<style>
  /* Farben folgen dem Browser. Hell ist der Ausgangswert, der dunkle Satz
     ueberschreibt ihn - so bleibt die Oberflaeche in beiden Faellen lesbar,
     statt wie bisher fest dunkel in einem hellen Fenster zu stehen. */
  :root {
    --bg: #ffffff;
    --fg: #111827;
    --gedaempft: #6b7280;
    --ghost-fg: #4b5563;
    --kbd-bg: #f3f4f6;
    --kbd-rand: #d1d5db;
    --fehler: #b91c1c;
    --gut: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f2937;
      --fg: #f3f4f6;
      --gedaempft: #9ca3af;
      --ghost-fg: #d1d5db;
      --kbd-bg: #374151;
      --kbd-rand: #4b5563;
      --fehler: #fca5a5;
      --gut: #86efac;
    }
  }
  body { font-family: system-ui, sans-serif; width: 268px; margin: 0; padding: 14px; background: var(--bg); color: var(--fg); }
  h1 { font-size: 14px; margin: 0 0 10px 0; }
  button { width: 100%; padding: 10px 12px; border: 0; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .primary { background: #2563eb; color: #fff; font-weight: 600; }
  .primary:hover { background: #1d4ed8; }
  .zweit { background: var(--kbd-bg); color: var(--fg); margin-top: 8px; border: 1px solid var(--kbd-rand); }
  .zweit:hover { border-color: #2563eb; }
  .ghost { background: transparent; color: var(--ghost-fg); margin-top: 8px; text-decoration: underline; }

  /* Schalter fuer stoerende Einblendungen.
     Er sitzt zwischen den beiden Aufnahmeknoepfen, weil er beide betrifft —
     und traegt seinen Zustand sichtbar, damit niemand raten muss, ob die
     letzte Aufnahme mit oder ohne Zustimmungsdialog entstanden ist. */
  .schalter { display: flex; align-items: center; gap: 10px; margin-top: 12px;
              padding: 9px 10px; border-radius: 6px; background: var(--kbd-bg);
              border: 1px solid var(--kbd-rand); cursor: pointer; user-select: none; }
  .schalter:hover { border-color: #2563eb; }
  .schalter input { appearance: none; width: 34px; height: 20px; border-radius: 10px;
                    background: var(--kbd-rand); position: relative; cursor: pointer;
                    flex: 0 0 auto; transition: background .15s; margin: 0; }
  .schalter input::after { content: ""; position: absolute; top: 2px; left: 2px;
                           width: 16px; height: 16px; border-radius: 50%; background: #fff;
                           transition: transform .15s; }
  .schalter input:checked { background: #2563eb; }
  .schalter input:checked::after { transform: translateX(14px); }
  .schalter-text { flex: 1; min-width: 0; }
  .schalter-titel { font-size: 12.5px; font-weight: 600; line-height: 1.25; }
  .schalter-hinweis { font-size: 10.5px; color: var(--gedaempft); margin-top: 2px; line-height: 1.3; }
  .status { margin-top: 10px; font-size: 12px; color: var(--gedaempft); min-height: 16px; }
  .err { color: var(--fehler); }
  .ok { color: var(--gut); }
  .kbd { background: var(--kbd-bg); border: 1px solid var(--kbd-rand); padding: 1px 6px; border-radius: 4px; font-family: monospace; font-size: 11px; }
  p { font-size: 11px; color: var(--gedaempft); margin: 8px 0 0 0; }
</style>
</head>
<body>
  <h1 data-i18n="popupHeading">Save the whole page as PDF</h1>
  <button id="go" class="primary" data-i18n="popupCapture">Capture whole page</button>
  <button id="region" class="zweit" data-i18n="popupRegion">Select an area…</button>

  <label class="schalter" for="hideSticky">
    <input type="checkbox" id="hideSticky" checked>
    <span class="schalter-text">
      <span class="schalter-titel" data-i18n="popupHideOverlays">Hide banners and pop-ups</span>
      <span class="schalter-hinweis" id="hideStickyHint" data-i18n="popupHideOverlaysHint">Consent dialogs and floating bars are hidden for the capture and restored afterwards.</span>
    </span>
  </label>

  <p><span data-i18n="popupShortcut">Whole page shortcut:</span> <span class="kbd" id="shortcut">…</span></p>
  <button id="opts" class="ghost" data-i18n="popupSettings">Settings</button>
  <div id="status" class="status"></div>
  <script src="compat.js"></script>
  <script src="i18n-data.js"></script>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
